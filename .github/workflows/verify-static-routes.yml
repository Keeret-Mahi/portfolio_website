name: Verify static routes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-static-routes.mjs
      - run: node scripts/verify-crawl-pages.mjs
      - name: Confirm generated pages are current
        run: git diff --exit-code
